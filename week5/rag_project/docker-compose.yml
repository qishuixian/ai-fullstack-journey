services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./ask:/app/uploads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always
