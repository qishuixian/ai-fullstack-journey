services:
  backend:
    image: ask-backend:latest
    container_name: ask-backend
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./ask:/app/uploads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always
    networks:
      - mynet

  frontend:
    image: ask-frontend:latest
    container_name: ask-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - mynet

networks:
  mynet:
    driver: bridge
