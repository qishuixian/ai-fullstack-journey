services:
  backend:
    image: ask-backend:latest
    container_name: ask-backend
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./ask:/app/uploads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    restart: always
    networks:
      - mynet

  frontend:
    image: ask-frontend:latest
    container_name: ask-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always
    networks:
      - mynet

networks:
  mynet:
    driver: bridge
