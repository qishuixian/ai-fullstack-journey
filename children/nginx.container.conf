# Complete server configuration used only inside the frontend container.
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = / { return 302 /children/; }
    location = /children { return 301 /children/; }

    location ^~ /children/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /children/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Missing files must not be served as the SPA HTML document.
    location ~* ^/children/.*\.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|txt|html)$ {
        try_files $uri =404;
    }

    location /children/ {
        try_files $uri $uri/ /children/index.html;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
