server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = / { return 302 /messageAgent/; }
    location = /messageAgent { return 301 /messageAgent/; }

    location ^~ /messageAgent/api/ {
        # Trailing slash removes /messageAgent/api/ before forwarding.
        proxy_pass http://backend:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
        access_log off;
    }

    location /messageAgent/assets/ { try_files $uri =404; }
    location /messageAgent/ {
        try_files $uri $uri/ /messageAgent/index.html;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
