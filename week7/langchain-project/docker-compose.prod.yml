services:
  backend:
    image: chat-agent-backend:latest
    container_name: chat-agent-backend
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always
    networks:
      - mynet

  frontend:
    image: chat-agent-frontend:latest
    container_name: chat-agent-frontend
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - mynet

networks:
  mynet:
    driver: bridge
