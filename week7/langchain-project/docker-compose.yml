services:
  backend:
    build: ./backend
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
